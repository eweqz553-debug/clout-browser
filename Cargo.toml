[package]
name = "clout-browser"
version = "1.0.0"
description = "An AI agent powered by DeepSeek"
authors = ["eweqz553"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = [ "shell-all", "system-tray" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
