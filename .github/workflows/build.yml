name: Build WORLD Browser
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Tauri Structure
        run: |
          mkdir src-tauri
          echo 'fn main() { tauri::Builder::default().run(tauri::generate_context!()).expect("error while running tauri application"); }' > src-tauri/main.rs
          echo '[package]' > src-tauri/Cargo.toml
          echo 'name = "world-browser"' >> src-tauri/Cargo.toml
          echo 'version = "1.0.0"' >> src-tauri/Cargo.toml
          echo 'edition = "2021"' >> src-tauri/Cargo.toml
          echo '[dependencies]' >> src-tauri/Cargo.toml
          echo 'tauri = { version = "1.5", features = ["api-all"] }' >> src-tauri/Cargo.toml
          echo '[build-dependencies]' >> src-tauri/Cargo.toml
          echo 'tauri-build = { version = "1.5" }' >> src-tauri/Cargo.toml
          echo 'fn main() { tauri_build::build() }' > src-tauri/build.rs

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Desktop App
        run: tauri build --bundles msi,exe
